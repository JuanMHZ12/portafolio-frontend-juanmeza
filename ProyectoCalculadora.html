<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de IMC | Juan José Meza</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">JuanMHZ12</a>

    <nav class="nav">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="portafolio.html" class="nav-link">Portafolio</a>
    </nav>
  </header>

  <main class="calculator-page">
    <section class="calculator-card">
      <p class="tag">Proyecto JavaScript</p>
      <h1>Calculadora de IMC</h1>
      <p class="calculator-description">
        Ingresa tu peso y altura para calcular tu índice de masa corporal.
      </p>

      <form id="imcForm">
        <div class="form-group">
          <label for="peso">Peso en kg</label>
          <input type="number" id="peso" placeholder="Ejemplo: 70" step="0.1" />
        </div>

        <div class="form-group">
          <label for="altura">Altura en metros</label>
          <input type="number" id="altura" placeholder="Ejemplo: 1.70" step="0.01" />
        </div>

        <button type="submit" class="btn primary">Calcular IMC</button>
      </form>

      <div id="resultado" class="result"></div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
